# kahdev.me - Site Configuration
# =============================

title: KAH
description: Personal site and projects
author: KAH
url: "https://kahdev.me"
baseurl: ""

# Build settings
markdown: kramdown
permalink: pretty

# Sass/SCSS settings
sass:
  style: compressed

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - scripts/
  - Makefile
  - "*.sh"
  - google*.html

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      layout: "default"