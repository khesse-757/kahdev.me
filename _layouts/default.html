<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ page.description | default: site.description }}">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  
  <!-- Styles -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  
  {% if page.extra_css %}
  <link rel="stylesheet" href="{{ page.extra_css | relative_url }}">
  {% endif %}
</head>
<body>
  <div class="site-container">
    {% unless page.hide_nav %}
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}" class="nav-link{% if page.url == '/' %} active{% endif %}">home</a>
      <a href="{{ '/projects' | relative_url }}" class="nav-link{% if page.url contains '/projects' %} active{% endif %}">projects</a>
      <a href="{{ '/blog' | relative_url }}" class="nav-link{% if page.url contains '/blog' %} active{% endif %}">blog</a>
      <a href="{{ '/about' | relative_url }}" class="nav-link{% if page.url == '/about/' %} active{% endif %}">about</a>
    </nav>
    {% endunless %}
    
    <main class="content">
      {{ content }}
    </main>
    
    <footer class="site-footer">
      <p>
        source: <a href="https://github.com/khesse-757/kah.dev">github</a>
        · © {{ 'now' | date: "%Y" }} kah.dev
      </p>
    </footer>
  </div>
  
  {% if page.scripts %}
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
  {% endif %}
</body>
</html>
